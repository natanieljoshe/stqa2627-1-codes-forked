name: Linting and Unittest Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f 09_devops_github_actions/requirements.txt ]; then pip install -r 09_devops_github_actions/requirements.txt; fi

      - name: Lint with Flake8
        working-directory: ./09_devops_github_actions
        run: flake8 . --count --select=E1,F4 --show-source --statistics

      - name: Run Unit Tests
        working-directory: ./09_devops_github_actions
        run: pytest
